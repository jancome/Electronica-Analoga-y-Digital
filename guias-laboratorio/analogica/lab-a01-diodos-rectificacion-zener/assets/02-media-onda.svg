<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="title desc">
  <title id="title">Rectificador de media onda</title>
  <desc id="desc">La terminal AC1 alimenta el ánodo de un diodo 1N4007. El cátodo con banda se conecta a VOUT positivo. Una resistencia de un kiloohmio cierra el circuito hacia AC2.</desc>
  <rect width="1280" height="540" fill="#f3f7f9"/>
  <text x="52" y="54" font-family="Arial" font-size="30" font-weight="700" fill="#11293b">Circuito 2 · Rectificador de media onda</text>
  <text x="52" y="88" font-family="Arial" font-size="19" fill="#536d7d">Use solamente el secundario aislado de 9 V RMS. AC2 es la referencia de salida únicamente en este montaje.</text>
  <circle cx="124" cy="236" r="52" fill="#071d2d"/><text x="124" y="229" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="white">AC1</text><text x="124" y="254" text-anchor="middle" font-family="Arial" font-size="15" fill="white">9 V RMS</text>
  <line x1="176" y1="236" x2="300" y2="236" stroke="#03a9c7" stroke-width="8"/>
  <rect x="300" y="180" width="300" height="112" rx="12" fill="white" stroke="#f6a51c" stroke-width="4"/>
  <text x="450" y="216" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#11293b">D1 · 1N4007</text>
  <text x="350" y="252" text-anchor="middle" font-family="Arial" font-size="18" fill="#11293b">Ánodo A</text>
  <text x="545" y="252" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#d94c4c">Cátodo K · banda</text>
  <line x1="600" y1="236" x2="760" y2="236" stroke="#03a9c7" stroke-width="8"/>
  <circle cx="760" cy="236" r="11" fill="#d94c4c"/><text x="760" y="188" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#d94c4c">VOUT+</text>
  <line x1="760" y1="236" x2="944" y2="236" stroke="#03a9c7" stroke-width="8"/>
  <rect x="944" y="180" width="220" height="112" rx="12" fill="white" stroke="#32a66f" stroke-width="4"/>
  <text x="1054" y="226" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#11293b">RL = 1 kΩ</text>
  <text x="1054" y="258" text-anchor="middle" font-family="Arial" font-size="17" fill="#536d7d">carga</text>
  <line x1="1054" y1="292" x2="1054" y2="408" stroke="#03a9c7" stroke-width="8"/>
  <line x1="1054" y1="408" x2="176" y2="408" stroke="#03a9c7" stroke-width="8"/>
  <circle cx="124" cy="408" r="52" fill="#071d2d"/><text x="124" y="401" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="white">AC2</text><text x="124" y="426" text-anchor="middle" font-family="Arial" font-size="15" fill="white">VOUT−</text>
  <line x1="176" y1="408" x2="1054" y2="408" stroke="#03a9c7" stroke-width="8"/>
  <path d="M240 142 C270 108, 300 176, 330 142 S390 108, 420 142" fill="none" stroke="#7567b5" stroke-width="4"/>
  <text x="330" y="122" text-anchor="middle" font-family="Arial" font-size="16" fill="#7567b5">entrada AC</text>
  <path d="M770 142 C800 108, 830 176, 860 142 L920 142" fill="none" stroke="#32a66f" stroke-width="4"/>
  <text x="850" y="122" text-anchor="middle" font-family="Arial" font-size="16" fill="#32a66f">salida pulsante</text>
  <text x="60" y="505" font-family="Arial" font-size="17" fill="#536d7d">Medidas: entrada entre AC1–AC2; salida entre VOUT+–AC2. No conecte el capacitor en esta etapa.</text>
</svg>
