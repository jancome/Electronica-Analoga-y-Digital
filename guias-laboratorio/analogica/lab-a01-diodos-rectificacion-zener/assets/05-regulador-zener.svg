<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">Regulador Zener de 5,1 voltios con carga y LED</title>
  <desc id="desc">La salida filtrada del puente se conecta mediante una resistencia de 160 ohmios al nodo de salida. Desde ese nodo se conectan en paralelo el Zener en inversa, una carga de 270 ohmios y una rama de resistencia de 390 ohmios más LED.</desc>
  <rect width="1280" height="650" fill="#f3f7f9"/>
  <text x="52" y="54" font-family="Arial" font-size="30" font-weight="700" fill="#11293b">Circuito 5 · Regulador Zener de ≈5,1 V</text>
  <text x="52" y="88" font-family="Arial" font-size="19" fill="#536d7d">Las tres ramas de salida se conectan entre VOUT y V−. El Zener trabaja polarizado en inversa.</text>
  <circle cx="116" cy="214" r="60" fill="#071d2d"/><text x="116" y="206" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="white">VIN</text><text x="116" y="232" text-anchor="middle" font-family="Arial" font-size="15" fill="#61d9ec">filtrada</text>
  <line x1="176" y1="214" x2="286" y2="214" stroke="#03a9c7" stroke-width="8"/>
  <rect x="286" y="164" width="270" height="100" rx="12" fill="white" stroke="#f6a51c" stroke-width="4"/>
  <text x="421" y="204" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#11293b">RS = 160 Ω</text>
  <text x="421" y="236" text-anchor="middle" font-family="Arial" font-size="17" fill="#536d7d">0,5 W</text>
  <line x1="556" y1="214" x2="680" y2="214" stroke="#03a9c7" stroke-width="8"/>
  <circle cx="680" cy="214" r="12" fill="#d94c4c"/>
  <text x="680" y="162" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#d94c4c">VOUT ≈ 5,1 V</text>
  <line x1="680" y1="214" x2="1150" y2="214" stroke="#03a9c7" stroke-width="8"/>
  <line x1="116" y1="542" x2="1150" y2="542" stroke="#536d7d" stroke-width="8"/>
  <line x1="116" y1="274" x2="116" y2="542" stroke="#536d7d" stroke-width="8"/>
  <text x="116" y="580" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#536d7d">V− / GND DC</text>
  <rect x="620" y="286" width="250" height="180" rx="14" fill="#fff1d2" stroke="#f6a51c" stroke-width="4"/>
  <text x="745" y="326" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#11293b">Zener 5,1 V</text>
  <text x="745" y="362" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#d94c4c">K (banda) a VOUT</text>
  <text x="745" y="396" text-anchor="middle" font-family="Arial" font-size="18" fill="#11293b">A a V−</text>
  <text x="745" y="430" text-anchor="middle" font-family="Arial" font-size="16" fill="#536d7d">polarización inversa</text>
  <line x1="745" y1="214" x2="745" y2="286" stroke="#f6a51c" stroke-width="8"/>
  <line x1="745" y1="466" x2="745" y2="542" stroke="#f6a51c" stroke-width="8"/>
  <rect x="914" y="286" width="230" height="180" rx="14" fill="#dcf3e8" stroke="#32a66f" stroke-width="4"/>
  <text x="1029" y="350" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#11293b">RL = 270 Ω</text>
  <text x="1029" y="384" text-anchor="middle" font-family="Arial" font-size="17" fill="#536d7d">carga equivalente</text>
  <line x1="1029" y1="214" x2="1029" y2="286" stroke="#32a66f" stroke-width="8"/>
  <line x1="1029" y1="466" x2="1029" y2="542" stroke="#32a66f" stroke-width="8"/>
  <rect x="294" y="286" width="260" height="180" rx="14" fill="#e8e6fa" stroke="#7567b5" stroke-width="4"/>
  <text x="424" y="330" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#11293b">RLED = 390 Ω</text>
  <text x="424" y="366" text-anchor="middle" font-family="Arial" font-size="18" fill="#11293b">en serie con LED</text>
  <text x="424" y="402" text-anchor="middle" font-family="Arial" font-size="16" fill="#536d7d">A del LED hacia RLED</text>
  <text x="424" y="430" text-anchor="middle" font-family="Arial" font-size="16" fill="#536d7d">K del LED hacia V−</text>
  <line x1="424" y1="214" x2="424" y2="286" stroke="#7567b5" stroke-width="8"/>
  <line x1="424" y1="466" x2="424" y2="542" stroke="#7567b5" stroke-width="8"/>
  <text x="60" y="622" font-family="Arial" font-size="17" fill="#536d7d">Medidas: VOUT entre VOUT–V−; IR por caída en RS; IL por cada rama; IZ = IR − ILtotal. Verifique potencia antes de energizar.</text>
</svg>
